name: CI

on:
  push:
    branches: [main]
  pull_request:

# Kritik: bu iş axını heç vaxt real CLI (`claude`/`codex`) çağırmamalıdır.
# `ORCHESTRIS_E2E` bayrağı burada TƏYİN OLUNMUR — testlər yalnız FakeRunner
# və fixture-lərlə işləyir, sıfır token xərclənir (bax CLAUDE.md qayda 11).
env:
  CI: true

jobs:
  build:
    # windows-latest qəsdəndir: `resolve-exe.ts`/`spawn.ts`-in shim həlli və
    # `taskkill /T /F` məntiqi platformaya xasdır (CLAUDE.md qayda 6), testlər
    # bunu yoxlayır. `claude`/`codex` CI-da quraşdırılmayacaq, ona görə yalnız
    # FakeRunner yolları örtülür.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Sxem ↔ migrasiya dreyfi. `schema.ts` dəyişib migrasiya generasiya
      # olunmasa, tətbiq işə düşəndə köhnə sxemlə qalar və səhv yalnız
      # istifadəçinin bazasında görünərdi. `generate` dəyişiklik yoxdursa heç
      # nə yazmır — fayl yaranırsa deməli generasiya unudulub.
      # `</dev/null`: drizzle-kit ada dəyişikliyində sual verə bilər, CI-da
      # asılıb qalmaq əvəzinə dərhal sınmalıdır.
      - name: Migrasiya sinxronluğu
        shell: bash
        run: |
          pnpm --filter @orchestris/server db:check </dev/null
          pnpm --filter @orchestris/server db:generate </dev/null
          if [ -n "$(git status --porcelain apps/server/drizzle)" ]; then
            echo "::error::schema.ts dəyişib, amma migrasiya generasiya olunmayıb."
            echo "Düzəliş: pnpm --filter @orchestris/server db:generate"
            git status --porcelain apps/server/drizzle
            exit 1
          fi

      - run: pnpm test

      - run: pnpm --filter @orchestris/web build
